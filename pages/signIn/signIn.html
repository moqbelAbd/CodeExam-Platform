<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="signIn.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module" src="/common-js/main.js" defer></script>
    <script type="module" src="signIn.js" defer></script>
    <title>Sign in</title>
</head>
<body>

        <header id="page-header">  </header>

    <div class="signin-wrapper">
        <div class="signin-card">
            <form action="">
                <div class="card-logo">
                    <img src="\assets\codeExam Logo.png" alt="logo">
                </div>
            <h1>Sign In</h1>
            <p>Access your ExamTrack account</p>

            <div class="content">
                <label for="username-input">Username</label>
                <input type="text" id="username-input" placeholder="Enter your username" required>

                <label for="password-input">Password</label>
                <input type="password" id="password-input" placeholder="Enter your password" required>
            </div>
                <button class="signin-btn primary-btn" id="sign-in-btn">Sign In</button>

                <div id="login-error-message" class="alert alert-danger d-none my-3" role="alert">
                <i class="fa-solid fa-circle-exclamation me-2"></i> Invalid email or password
                </div>
                <p class="signup-link">Don't have an account? <a href="/pages/signUp/signUp.html">Sign Up</a></p>
            </form>
        </div>    
    </div>


    <div class="toast-container position-fixed top-0 end-0 p-3">
    <div id="errorToast" class="toast align-items-center text-bg-danger border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body">
                <i class="fa-solid fa-triangle-exclamation me-2"></i> Invalid credentials!
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
</div>

</body>
</html>
